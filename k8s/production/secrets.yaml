apiVersion: v1
kind: ConfigMap
metadata:
  name: avenai-config
  namespace: avenai-prod
data:
  DEBUG: "False"
  LOG_LEVEL: "INFO"
  ALLOWED_ORIGINS: "https://avenai.com,https://app.avenai.com"
  UPLOAD_DIR: "/app/uploads"
  MAX_FILE_SIZE: "10485760"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_MAX_REQUESTS: "100"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avenai-uploads-pvc
  namespace: avenai-prod
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avenai-postgres-pvc
  namespace: avenai-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avenai-redis-pvc
  namespace: avenai-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd
