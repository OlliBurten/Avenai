apiVersion: apps/v1
kind: Deployment
metadata:
  name: avenai-backend
  namespace: avenai-prod
  labels:
    app: avenai-backend
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: avenai-backend
  template:
    metadata:
      labels:
        app: avenai-backend
        version: v1.0.0
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-org/avenai:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: avenai-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: avenai-secrets
              key: redis-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: avenai-secrets
              key: openai-api-key
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: avenai-secrets
              key: secret-key
        - name: DEBUG
          value: "False"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: avenai-uploads-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avenai-frontend
  namespace: avenai-prod
  labels:
    app: avenai-frontend
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avenai-frontend
  template:
    metadata:
      labels:
        app: avenai-frontend
        version: v1.0.0
    spec:
      containers:
      - name: frontend
        image: ghcr.io/your-org/avenai:latest-frontend
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.avenai.com"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: avenai-backend-service
  namespace: avenai-prod
spec:
  selector:
    app: avenai-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: avenai-frontend-service
  namespace: avenai-prod
spec:
  selector:
    app: avenai-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avenai-ingress
  namespace: avenai-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - avenai.com
    - api.avenai.com
    secretName: avenai-tls
  rules:
  - host: avenai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: avenai-frontend-service
            port:
              number: 80
  - host: api.avenai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: avenai-backend-service
            port:
              number: 80
