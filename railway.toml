[build]
builder = "nixpacks"
buildCommand = "bash build.sh"

[deploy]
startCommand = "python3 -m uvicorn avenai_final:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"

# Force Railway to use our custom build process
[phases.setup]
nixPkgs = ["python3", "python3Packages.pip", "python3Packages.virtualenv", "bash"]

[phases.install]
cmds = [
  "chmod +x build.sh",
  "bash build.sh"
]
